name: treasury-poc-e2e

# ORA-2297 — productionizes the ebics-java sidecar against the in-house
# EBICS-3.0 mock server (introduced in ORA-2302 to replace the dead Libeufin
# upstream). Brings up `treasury-poc/docker-compose.ebics-mock.yml`, runs the
# smoke script, uploads response artifacts.
#
# CVE-Hardening — Hybrid A+C (ORA-2526, board-approved 2026-06-11 in ORA-2324):
#   * CRITICAL → hard gate (exit-code 1). Build fails. Escalation: CEO review.
#   * HIGH/MEDIUM → advisory SARIF upload to GitHub Security tab. No build break.
#     Track via Dependabot + monthly review per docs/security/cve-policy.md.
# Full policy: docs/security/cve-policy.md.

on:
  push:
    branches: [master, "feature/treasury-**"]
    paths:
      - "treasury-poc/**"
      - ".github/workflows/treasury-poc-e2e.yml"
      - ".github/dependabot.yml"
      - "docs/security/cve-policy.md"
  pull_request:
    paths:
      - "treasury-poc/**"
      - ".github/workflows/treasury-poc-e2e.yml"
      - ".github/dependabot.yml"
      - "docs/security/cve-policy.md"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: treasury-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sidecar image
        run: |
          docker buildx build \
            --load \
            -t ebics-sidecar-java:ci \
            ./services/ebics-sidecar-java

      - name: Bring up EBICS mock + sidecar
        run: |
          docker compose -f docker-compose.ebics-mock.yml up -d ebics-mock
          docker compose -f docker-compose.ebics-mock.yml up -d ebics-sidecar

      - name: Wait for sidecar readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/actuator/health/readiness; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "sidecar never became ready"; exit 1

      - name: Run e2e smoke
        run: |
          chmod +x scripts/smoke.sh
          ARTIFACTS_DIR="$PWD/smoke-artifacts" \
          SIDECAR_URL=http://127.0.0.1:8081 \
            scripts/smoke.sh

      - name: Capture container logs
        if: always()
        run: |
          mkdir -p smoke-artifacts/logs
          docker compose -f docker-compose.ebics-mock.yml logs --no-color \
            > smoke-artifacts/logs/compose.log || true
          docker logs ebics-sidecar > smoke-artifacts/logs/sidecar.log 2>&1 || true
          docker logs ebics-mock > smoke-artifacts/logs/ebics-mock.log 2>&1 || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-poc-smoke-artifacts
          path: treasury-poc/smoke-artifacts/
          retention-days: 14

      # CVE-Hardening Hybrid A+C — see docs/security/cve-policy.md.
      #
      # Tier 1 (HARD GATE): CRITICAL CVEs. exit-code=1. CEO is the only escalation
      # path for an allowlist exception (treasury-poc/.trivyignore + justification).
      - name: Trivy — CRITICAL hard gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ebics-sidecar-java:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          trivyignores: treasury-poc/.trivyignore

      # Tier 2 (ADVISORY): HIGH+MEDIUM. Emits SARIF for the GitHub Security tab.
      # Dependabot (.github/dependabot.yml) drives the remediation cadence; CEO
      # may ad-hoc floor-pin if a HIGH stays open >7d. Never blocks the build.
      - name: Trivy — HIGH/MEDIUM advisory (SARIF)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ebics-sidecar-java:ci
          severity: HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-advisory.sarif
          trivyignores: treasury-poc/.trivyignore

      - name: Upload Trivy advisory SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-advisory.sarif
          category: trivy-treasury-poc-advisory

      - name: Upload Trivy advisory SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-advisory-sarif
          path: trivy-advisory.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.ebics-mock.yml down -v
