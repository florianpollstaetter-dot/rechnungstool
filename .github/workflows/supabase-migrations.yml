name: Supabase migrations

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
      - '.github/scripts/apply_migrations.py'
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations
        env:
          # Preferred durable backend: a Postgres connection string whose
          # password does not expire (removes the recurring PAT-rotation 401,
          # see ORA-2812). When set, apply_migrations.py uses psql directly.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Fallback: account-scoped Management API PAT (expires; kept only so
          # the pipeline still works until SUPABASE_DB_URL is provisioned).
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 .github/scripts/apply_migrations.py
