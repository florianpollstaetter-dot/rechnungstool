name: Supabase migrations

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
      - '.github/scripts/apply_migrations.py'
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations
        # Prefers Direct-DB when SUPABASE_DB_URL is set (no PAT needed —
        # ORA-2757). Falls back to the Management-API PAT path when it is
        # absent, so this stays green until the DB-URL secret is wired in.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 .github/scripts/apply_migrations.py
