name: Supabase migrations

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
      - '.github/scripts/apply_migrations.py'
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint migrations for permissive USING(true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for permissive RLS policies (SCH-833)
        run: bash scripts/check-migrations.sh

  push:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 .github/scripts/apply_migrations.py
