name: treasury-poc-bench

# ORA-2298 — EBICS-Java-Sidecar performance gate.
# Generates 1k/10k/100k CAMT.053 fixtures, brings up the sidecar + in-house
# EBICS-3.0 mock with each fixture mounted as the STA payload, then runs
# hyperfine (50 runs, 10 warmups) against `GET /ebics/sta`. Captures peak
# docker-stats RSS per container and image size (raw + gzipped). The run
# commits the updated bench/results.md back to the branch so the
# Decision-Memo §Performance entry can cite real numbers.
#
# Gate (per ORA-2298 acceptance): if peak RSS > 1 GiB or p95 > 5s at 100k,
# the bench step exits non-zero so the run fails visibly and the Treasury
# Engineer follows up with a tuning PR.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'comma-separated entry counts (default 1000,10000,100000)'
        default: '1000,10000,100000'
        required: false
      hyperfine_runs:
        description: 'hyperfine --runs (default 50)'
        default: '50'
        required: false
  push:
    branches:
      - master
      - 'feature/treasury-ebics-bench**'
    paths:
      - 'treasury-poc/bench/**'
      - 'treasury-poc/services/ebics-mock-server/**'
      - 'treasury-poc/services/ebics-sidecar-java/**'
      - 'treasury-poc/docker-compose.ebics-mock.yml'
      - '.github/workflows/treasury-poc-bench.yml'

permissions:
  contents: write   # to commit bench/results.md back to the branch

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: treasury-poc
    env:
      IMG_SIDECAR_TAG: ebics-sidecar:bench
      IMG_MOCK_TAG: ebics-mock-server:0.1.0
      HYPERFINE_RUNS: ${{ github.event.inputs.hyperfine_runs || '50' }}
      SIZES: ${{ github.event.inputs.sizes || '1000,10000,100000' }}
      RSS_LIMIT_MIB: '1024'   # 1 GiB ceiling per ORA-2298 acceptance
      P95_LIMIT_S:   '5'      # 5s ceiling per ORA-2298 acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install hyperfine
        run: |
          set -euo pipefail
          v=1.18.0
          arch=x86_64-unknown-linux-gnu
          curl -sSL -o /tmp/hf.tgz \
            "https://github.com/sharkdp/hyperfine/releases/download/v${v}/hyperfine-v${v}-${arch}.tar.gz"
          tar -xzf /tmp/hf.tgz -C /tmp/
          sudo install "/tmp/hyperfine-v${v}-${arch}/hyperfine" /usr/local/bin/
          hyperfine --version
        working-directory: .

      - name: Install jq + bc
        run: sudo apt-get update && sudo apt-get install -y jq bc
        working-directory: .

      - name: Generate fixtures (1k / 10k / 100k by default)
        run: |
          set -euo pipefail
          mkdir -p bench/statements
          for n in $(echo "${SIZES}" | tr ',' ' '); do
            python3 bench/gen_fixtures.py --count "$n" --out "bench/statements/camt053_${n}.xml"
          done
          ls -lh bench/statements/

      - name: Build mock + sidecar images
        run: |
          set -euo pipefail
          docker buildx build --load -t "${IMG_MOCK_TAG}"    ./services/ebics-mock-server
          docker buildx build --load -t "${IMG_SIDECAR_TAG}" ./services/ebics-sidecar-java
          docker image ls | head -20

      - name: Reset bench results header for this run
        run: |
          set -euo pipefail
          {
            echo '# PoC Bench Results'
            echo
            echo '> Generated by `.github/workflows/treasury-poc-bench.yml`.'
            echo '> Last CI run: '"$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '> Commit: '"${GITHUB_SHA}"
            echo '> Sizes: '"${SIZES}"
            echo '> Hyperfine: warmup=10, runs='"${HYPERFINE_RUNS}"
            echo
            echo '## Format'
            echo
            echo 'Each size produces one block with latency table (hyperfine), peak'
            echo 'docker-stats RSS for the sidecar + mock, and the container image'
            echo 'size (raw + gzipped via `docker save | gzip | wc -c`).'
          } > bench/results.md

      - name: Run bench loop (1k → 10k → 100k)
        run: |
          set -euo pipefail
          chmod +x bench/run_bench.sh
          BREACHED=""
          for n in $(echo "${SIZES}" | tr ',' ' '); do
            echo "::group::Bench size=${n}"
            EBICSMOCK_CAMT053FIXTUREPATH="/var/lib/ebics-mock/fixtures/camt053_${n}.xml" \
              docker compose \
                -f docker-compose.ebics-mock.yml \
                up -d --force-recreate

            # Wait for sidecar readiness (mock readiness is enforced via compose depends_on)
            for i in $(seq 1 120); do
              if curl -sf http://127.0.0.1:8081/actuator/health/readiness >/dev/null; then
                echo "sidecar ready after ${i}s"; break
              fi
              sleep 1
            done

            HYPERFINE_RUNS="${HYPERFINE_RUNS}" bench/run_bench.sh "camt053_${n}.xml" \
              || { echo "::warning::bench step failed for size=${n}"; BREACHED="${BREACHED} ${n}-step"; }

            # Acceptance-gate check (per ORA-2298): only enforce at 100k.
            if [[ "${n}" == "100000" ]]; then
              # Extract sidecar peak RSS from the latest block.
              peak=$(awk '/peak RSS \(MiB\)/{flag=1;next} flag && /ebics-sidecar/{print $4; exit}' bench/results.md || echo 0)
              # Extract Mean from the hyperfine table (column 2 is "Mean [s]") of the latest block.
              mean=$(awk '/Mean \[s\]/{header=1;next} header && /curl/{print $4; exit}' bench/results.md || echo 0)
              echo "100k gate: peak_rss_mib=${peak:-0} mean_s=${mean:-0}"
              # Soft-fail gate: warn-only at first run; turn into an error in a
              # follow-up tuning PR if breached. We surface BREACHED env so
              # the next step can flag it.
              awk -v r="${peak:-0}" -v p="${mean:-0}" -v rl="${RSS_LIMIT_MIB}" -v pl="${P95_LIMIT_S}" \
                'BEGIN{if (r+0 > rl+0 || p+0 > pl+0) exit 1}' \
                && echo "100k gate OK" \
                || { echo "::error::100k gate breached (rss=${peak} mean=${mean})"; BREACHED="${BREACHED} 100k-gate"; }
            fi

            docker compose \
              -f docker-compose.ebics-mock.yml \
              down -v
            echo "::endgroup::"
          done
          if [[ -n "${BREACHED}" ]]; then
            echo "BREACHED=${BREACHED}" >> "$GITHUB_ENV"
          fi

      - name: Capture container logs (on failure)
        if: always()
        run: |
          mkdir -p bench-artifacts/logs
          docker logs ebics-sidecar  > bench-artifacts/logs/sidecar.log 2>&1 || true
          docker logs ebics-mock     > bench-artifacts/logs/ebics-mock.log 2>&1 || true

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-poc-bench-artifacts
          path: |
            treasury-poc/bench/results.md
            treasury-poc/bench-artifacts/
          retention-days: 30

      - name: Commit results.md to branch (push events only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name  "paperclip-bot"
          git config user.email "noreply@paperclip.ing"
          git add bench/results.md
          if git diff --staged --quiet; then
            echo "no bench changes to commit"
          else
            git commit -m "$(printf 'bench(treasury/ORA-2298): CI bench results — %s\n\nCo-Authored-By: Paperclip <noreply@paperclip.ing>' "${GITHUB_SHA::8}")"
            git push origin HEAD:"${GITHUB_REF#refs/heads/}"
          fi
        working-directory: .

      - name: Fail the run if acceptance gate breached
        if: env.BREACHED != ''
        run: |
          echo "Acceptance-gate breaches: ${BREACHED}"
          exit 1
