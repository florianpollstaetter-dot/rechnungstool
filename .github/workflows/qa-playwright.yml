name: qa-playwright

# SCH-976 — K2-γ QA suite. Runs the Playwright specs in tests/e2e/specs
# against a freshly-provisioned `qa-perms-<runid>` tenant on the configured
# Supabase project. Triggered on PRs that touch app/test code, on pushes to
# master, and manually via workflow_dispatch.
#
# Required repo secrets (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROJECT_REF
#
# ORA-2286 — Vercel preview integration (Option A). When these four secrets
# are present, PR runs resolve the preview URL for the exact commit being
# tested instead of falling back to master prod. All four must be set together;
# if any is absent the workflow falls back to the static PLAYWRIGHT_BASE_URL /
# master prod URL (graceful degradation, no hard failure).
#   VERCEL_TOKEN          — Vercel API token (user or team scope)
#   VERCEL_PROJECT_ID     — project ID from Vercel project settings
#   VERCEL_TEAM_ID        — team ID (leave empty for personal accounts)
#   VERCEL_PROTECTION_BYPASS — bypass secret from Vercel › Settings ›
#                              Deployment Protection › Protection Bypass for Automation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-playwright.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-playwright.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override BASE_URL (e.g. https://my-preview.vercel.app)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # BASE_URL resolution order (highest priority first):
      #   1. workflow_dispatch input.base_url
      #   2. PLAYWRIGHT_BASE_URL repo secret
      #   3. ORA-2286 — for pull_request events with Vercel secrets present,
      #      the "Resolve Vercel preview URL for PR" step below writes the
      #      preview URL into $GITHUB_ENV (overrides the empty default).
      #   4. Empty → playwright.config.ts boots `npm run dev` in-runner
      #      (SCH-2089: slug conflict was fixed in 35f7cb5, so local dev
      #      server works in CI again).
      BASE_URL: ${{ inputs.base_url || secrets.PLAYWRIGHT_BASE_URL || '' }}
      # ORA-2286 — bypass header for Vercel Deployment Protection on
      # preview URLs. Read by playwright.config.ts → use.extraHTTPHeaders.
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      CI: "true"
    steps:
      - name: Guard — Supabase secrets must be present
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}" >&2
            echo "Add them under Settings → Secrets → Actions." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ORA-2286 — Option A: for pull_request events, resolve the Vercel
      # preview URL for the exact HEAD commit so tests run against PR code,
      # not master prod. Requires VERCEL_TOKEN + VERCEL_PROJECT_ID; if absent,
      # falls back gracefully to the static BASE_URL set in the job env.
      - name: Resolve Vercel preview URL for PR
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          team_param=""
          [ -n "$VERCEL_TEAM_ID" ] && team_param="&teamId=$VERCEL_TEAM_ID"

          # Poll up to 3 minutes for the preview deployment to be ready.
          # Vercel typically completes in ~90 s for a cached Next.js build.
          for attempt in $(seq 1 18); do
            response=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?meta-githubCommitSha=$COMMIT_SHA&projectId=$VERCEL_PROJECT_ID&limit=5$team_param" \
              2>/dev/null || true)

            preview_url=$(echo "$response" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          deployments = data.get('deployments', [])
          ready = [d for d in deployments if d.get('state') == 'READY']
          if ready:
              print('https://' + ready[0]['url'])
          " 2>/dev/null || true)

            if [ -n "$preview_url" ]; then
              echo "✓ Preview URL resolved: $preview_url"
              echo "BASE_URL=$preview_url" >> "$GITHUB_ENV"
              break
            fi

            echo "Attempt $attempt/18: preview not ready yet, waiting 10 s…"
            sleep 10
          done

          if [ -z "$preview_url" ]; then
            echo "::warning::Vercel preview URL not found for $COMMIT_SHA after 3 min — falling back to $BASE_URL"
          fi

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Apply pending Supabase migrations
        # ORA-2901: only run on push-to-master (not on PRs). A PR must not
        # mutate the shared QA/prod schema pre-merge; migrations belong on
        # push + supabase-migrations.yml. Skipping on pull_request also
        # removes the expired SUPABASE_ACCESS_TOKEN 401 from the merge gate
        # (ORA-2798/ORA-2391 credential rotation is founder-blocked).
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/apply_migrations.py
      - name: Run Playwright suite
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/.artifacts
            playwright-report
          retention-days: 7
