name: qa-playwright

# SCH-976 — K2-γ QA suite. Runs the Playwright specs in tests/e2e/specs
# against a freshly-provisioned `qa-perms-<runid>` tenant on the configured
# Supabase project. Triggered on PRs that touch app/test code, on pushes to
# master, and manually via workflow_dispatch.
#
# Required repo secrets (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROJECT_REF
#
# ORA-2286 — Vercel preview integration (Option A). When these four secrets
# are present, PR runs resolve the preview URL for the exact commit being
# tested instead of falling back to master prod. All four must be set together;
# if any is absent the workflow falls back to the static PLAYWRIGHT_BASE_URL /
# master prod URL (graceful degradation, no hard failure).
#   VERCEL_TOKEN          — Vercel API token (user or team scope)
#   VERCEL_PROJECT_ID     — project ID from Vercel project settings
#   VERCEL_TEAM_ID        — team ID (leave empty for personal accounts)
#   VERCEL_PROTECTION_BYPASS — bypass secret from Vercel › Settings ›
#                              Deployment Protection › Protection Bypass for Automation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-playwright.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-playwright.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override BASE_URL (e.g. https://my-preview.vercel.app)"
        required: false
        default: ""
      # ORA-2471 — run a subset so the spec under verification (e.g. SCH-930 /
      # spec 19) yields a result without the 25-min budget being consumed by
      # the full serial suite. Value is a Playwright path/substring filter.
      spec_filter:
        description: "Run only specs matching this path/substring (e.g. 19-sch930). Empty = full suite."
        required: false
        default: ""
      # ORA-2471 — bypass the (CTO-owned) Vercel-preview / PLAYWRIGHT_BASE_URL
      # auth path entirely and test against an in-runner `next dev` server on
      # the QA Supabase project. Hermetic verification path that does not depend
      # on a deployed preview being reachable.
      force_local_dev:
        description: "Ignore preview/PLAYWRIGHT_BASE_URL; run against in-runner `next dev`."
        type: boolean
        required: false
        default: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # BASE_URL resolution order (highest priority first):
      #   1. workflow_dispatch input.base_url
      #   2. PLAYWRIGHT_BASE_URL repo secret
      #   3. ORA-2286 — for pull_request events with Vercel secrets present,
      #      the "Resolve Vercel preview URL for PR" step below writes the
      #      preview URL into $GITHUB_ENV (overrides the empty default).
      #   4. Empty → playwright.config.ts boots `npm run dev` in-runner
      #      (SCH-2089: slug conflict was fixed in 35f7cb5, so local dev
      #      server works in CI again).
      BASE_URL: ${{ inputs.base_url || secrets.PLAYWRIGHT_BASE_URL || '' }}
      # ORA-2286 — bypass header for Vercel Deployment Protection on
      # preview URLs. Read by playwright.config.ts → use.extraHTTPHeaders.
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      # ORA-2470 — mapped to job env so the "Resolve Vercel preview URL" step
      # can gate itself via the `env` context. The `secrets` context is NOT
      # available in step-level `if:` conditions, so referencing it there made
      # the whole workflow invalid → 0-job startup failure.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CI: "true"
    steps:
      - name: Guard — Supabase secrets must be present
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}" >&2
            echo "Add them under Settings → Secrets → Actions." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ORA-2471 — when dispatched with force_local_dev, blank BASE_URL so
      # playwright.config.ts boots `npm run dev` in-runner instead of targeting
      # the (currently unreachable) Vercel preview / PLAYWRIGHT_BASE_URL.
      - name: ORA-2471 — force in-runner dev server
        if: inputs.force_local_dev
        run: |
          echo "force_local_dev=true → clearing BASE_URL; playwright will boot 'npm run dev'."
          echo "BASE_URL=" >> "$GITHUB_ENV"

      # ORA-2286 — Option A: for pull_request events, resolve the Vercel
      # preview URL for the exact HEAD commit so tests run against PR code,
      # not master prod. Requires VERCEL_TOKEN + VERCEL_PROJECT_ID; if absent,
      # falls back gracefully to the static BASE_URL set in the job env.
      - name: Resolve Vercel preview URL for PR
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          team_param=""
          [ -n "$VERCEL_TEAM_ID" ] && team_param="&teamId=$VERCEL_TEAM_ID"

          # ORA-2471 — Poll up to 4 minutes for the preview deployment to be
          # ready. Earlier this step silently swallowed all API errors (curl -sf
          # + 2>/dev/null), so a wrong token / project / team / SHA was
          # indistinguishable from "still building" — every attempt just logged
          # "not ready". We now capture the HTTP status and the deployment
          # states so a failure to resolve is diagnosable, and we accept both
          # the `state` and legacy `readyState` field names.
          for attempt in $(seq 1 24); do
            body=$(curl -s -w '\n%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?meta-githubCommitSha=$COMMIT_SHA&projectId=$VERCEL_PROJECT_ID&limit=10$team_param" \
              2>/dev/null || true)
            http_code=$(printf '%s' "$body" | tail -n1)
            response=$(printf '%s' "$body" | sed '$d')

            # python prints a single "url|states" line; bash splits on the
            # first '|'. Keeps the parse off heredocs/multiline output, which
            # are brittle inside a YAML block scalar.
            # python prints a single "url|states" line; bash splits on the
            # first '|'. One physical line (no newlines) so YAML block-scalar
            # indentation can't corrupt the script; a non-JSON body (e.g. an
            # auth-error page) makes python exit non-zero → "|ERR".
            parsed=$(printf '%s' "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); deps=d.get('deployments',[]); f=lambda x:(x.get('state') or x.get('readyState') or '?'); r=[x for x in deps if f(x)=='READY']; u=('https://'+r[0]['url']) if (r and r[0].get('url')) else ''; print(u+'|'+(','.join(f(x) for x in deps) or 'NONE'))" 2>/dev/null || printf '|ERR')
            preview_url=${parsed%%|*}
            states=${parsed#*|}

            if [ -n "$preview_url" ]; then
              echo "✓ Preview URL resolved: $preview_url"
              echo "BASE_URL=$preview_url" >> "$GITHUB_ENV"
              break
            fi

            echo "Attempt $attempt/24: http=$http_code deployment_states=[$states] — waiting 10 s…"
            sleep 10
          done

          if [ -z "$preview_url" ]; then
            echo "::warning::Vercel preview URL not found for $COMMIT_SHA after 4 min (last http=$http_code, states=[$states]) — falling back to $BASE_URL. If http!=200 the VERCEL_TOKEN/PROJECT_ID/TEAM_ID secrets are likely wrong; if states=[NONE] no Vercel preview is being built for this commit (check the Git integration)."
          fi

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      # ORA-2470 — A PR that adds no migration files has nothing to apply, yet
      # apply_migrations.py still queries the Supabase Management API first to
      # read schema_migrations. With an expired SUPABASE_ACCESS_TOKEN that query
      # hard-fails (401) and skips the whole Playwright suite (see ORA-2390/2391
      # for the PAT rotation). The repo always ships committed migration files,
      # so the script's "empty dir" guard never triggers. Gate the step on
      # whether *this PR* actually touches supabase/migrations/ instead.
      - name: Detect migration changes (PR only)
        id: migcheck
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if echo "$files" | grep -q '^supabase/migrations/'; then
            echo "PR touches supabase/migrations/ — migrations will be applied."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR adds no migration files — skipping Supabase migration step."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply pending Supabase migrations
        # Runs on push-to-master always, and on PRs only when the PR itself
        # adds/edits migration files. ORA-2471: workflow_dispatch runs SKIP this
        # step — manual verification runs must not depend on the (expired,
        # CTO-owned) Supabase PAT (ORA-2390/2391), which 401s here and aborts
        # the job before any spec executes. Idempotent: skips versions already
        # in supabase_migrations.schema_migrations.
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.migcheck.outputs.changed == 'true')
        run: python3 .github/scripts/apply_migrations.py
      # ORA-2471 — the suite runs serially (workers:1) and a systemic auth/env
      # failure burns ~2 min/spec (60 s timeout × 1 retry), exhausting the
      # 25-min job budget before the alphabetically-last spec (19-sch930) ever
      # runs — leaving SCH-930 with no pass/fail. Run that spec first so it
      # always produces a result. Skipped when a spec_filter targets a subset.
      - name: Run SCH-930 verification spec first (ORA-2471)
        if: ${{ !inputs.spec_filter }}
        run: npx playwright test tests/e2e/specs/19-sch930-product-customer-sort-search.spec.ts
      - name: Run Playwright suite
        env:
          SPEC_FILTER: ${{ inputs.spec_filter }}
        run: |
          if [ -n "$SPEC_FILTER" ]; then
            echo "Running filtered specs: $SPEC_FILTER"
            npx playwright test "$SPEC_FILTER"
          else
            npm run test:e2e
          fi
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/.artifacts
            playwright-report
          retention-days: 7
