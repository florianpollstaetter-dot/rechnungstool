name: qa-playwright

# SCH-976 — K2-γ QA suite. Runs the Playwright specs in tests/e2e/specs
# against a freshly-provisioned `qa-perms-<runid>` tenant on the configured
# Supabase project. Triggered on PRs that touch app/test code, on pushes to
# master, and manually via workflow_dispatch.
#
# Required repo secrets (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROJECT_REF
#
# ORA-2286 — Vercel preview integration (Option A). When these four secrets
# are present, PR runs resolve the preview URL for the exact commit being
# tested instead of falling back to master prod. All four must be set together;
# if any is absent the workflow falls back to the static PLAYWRIGHT_BASE_URL /
# master prod URL (graceful degradation, no hard failure).
#   VERCEL_TOKEN          — Vercel API token (user or team scope)
#   VERCEL_PROJECT_ID     — project ID from Vercel project settings
#   VERCEL_TEAM_ID        — team ID (leave empty for personal accounts)
#   VERCEL_PROTECTION_BYPASS — bypass secret from Vercel › Settings ›
#                              Deployment Protection › Protection Bypass for Automation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-playwright.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/qa-playwright.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override BASE_URL (e.g. https://my-preview.vercel.app)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # BASE_URL resolution order (highest priority first):
      #   1. workflow_dispatch input.base_url
      #   2. PLAYWRIGHT_BASE_URL repo secret
      #   3. ORA-2286 — for pull_request events with Vercel secrets present,
      #      the "Resolve Vercel preview URL for PR" step below writes the
      #      preview URL into $GITHUB_ENV (overrides the empty default).
      #   4. Empty → playwright.config.ts boots `npm run dev` in-runner
      #      (SCH-2089: slug conflict was fixed in 35f7cb5, so local dev
      #      server works in CI again).
      BASE_URL: ${{ inputs.base_url || secrets.PLAYWRIGHT_BASE_URL || '' }}
      # ORA-2286 — bypass header for Vercel Deployment Protection on
      # preview URLs. Read by playwright.config.ts → use.extraHTTPHeaders.
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      CI: "true"
    steps:
      - name: Guard — Supabase secrets must be present
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}" >&2
            echo "Add them under Settings → Secrets → Actions." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ORA-2286 — Option A: for pull_request events, resolve the Vercel
      # preview URL for the exact HEAD commit so tests run against PR code,
      # not master prod. Requires VERCEL_TOKEN + VERCEL_PROJECT_ID; if absent,
      # falls back gracefully to the static BASE_URL set in the job env.
      - name: Resolve Vercel preview URL for PR
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          team_param=""
          [ -n "$VERCEL_TEAM_ID" ] && team_param="&teamId=$VERCEL_TEAM_ID"

          # Poll up to 7 minutes for the preview deployment to be ready.
          # ORA-2946: a cold Next.js preview build routinely exceeds 3 min, so a
          # short window misses a preview that exists but is still BUILDING.
          # 42×10s = 7 min covers cold builds with margin.
          #
          # We fetch the project's recent deployments and match the PR head sha
          # *client-side* instead of relying on the `meta-githubCommitSha` query
          # filter. A run on 2026-07-23 polled the full 7 min with that filter
          # and never matched — with no way to tell whether the project id was
          # wrong, the token lacked access, or the build was merely slow. Each
          # attempt now logs exactly what Vercel returned (count + per-deploy
          # sha:state) so any future miss is diagnosable from the log alone.
          preview_url=""
          for attempt in $(seq 1 42); do
            response=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=20$team_param" \
              2>/dev/null || true)

            out=$(printf '%s' "$response" | COMMIT_SHA="$COMMIT_SHA" python3 -c '
          import sys, os, json
          sha = os.environ.get("COMMIT_SHA", "")
          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except Exception:
              print("DIAG: Vercel response was not valid JSON (auth/network error?)"); sys.exit(0)
          if isinstance(data, dict) and data.get("error"):
              e = data["error"]
              print("DIAG: Vercel API error %s: %s" % (e.get("code"), str(e.get("message"))[:140])); sys.exit(0)
          deps = data.get("deployments", []) if isinstance(data, dict) else []
          def dsha(d):
              m = d.get("meta") or {}
              return m.get("githubCommitSha") or (d.get("gitSource") or {}).get("sha") or ""
          states = ", ".join("%s:%s" % ((dsha(d) or "?")[:7], d.get("state")) for d in deps[:8]) or "none"
          print("DIAG: %d recent deployment(s); [%s]" % (len(deps), states))
          for d in deps:
              if dsha(d) == sha and d.get("state") == "READY" and d.get("url"):
                  print("URL: https://" + d["url"]); break
          ' 2>/dev/null || true)

            echo "$out" | grep "^DIAG:" | sed "s#^DIAG:#  Attempt $attempt/42 —#" || true
            preview_url=$(echo "$out" | sed -n 's/^URL: //p' | head -1)

            if [ -n "$preview_url" ]; then
              echo "✓ Preview URL resolved for $COMMIT_SHA: $preview_url"
              echo "BASE_URL=$preview_url" >> "$GITHUB_ENV"
              echo "PREVIEW_RESOLVED=1" >> "$GITHUB_ENV"
              break
            fi

            sleep 10
          done

          if [ -z "$preview_url" ]; then
            echo "::warning::No READY Vercel preview matching $COMMIT_SHA after 7 min (see per-attempt DIAG lines above for what Vercel returned)."
          fi

      # ORA-2946: On PRs, never fall through to the prod BASE_URL. The QA suite
      # depends on preview-only fixtures/state; running it against prod makes
      # every spec time out at 60 s and the job hits the 25-min ceiling with a
      # useless "cancelled" signal. Fail fast with an actionable message instead
      # so a re-run (with a warm preview) can go green quickly.
      - name: Require resolved preview on PRs
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != '' && env.PREVIEW_RESOLVED != '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "::error::No READY Vercel preview for this PR commit after 7 min." >&2
          echo "The e2e suite is not run against the prod fallback URL (all specs" >&2
          echo "would time out and burn the 25-min job budget). Re-run this job" >&2
          echo "once the Vercel preview deployment has finished building." >&2
          exit 1

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Apply pending Supabase migrations
        # ORA-2901: only run on push-to-master (not on PRs). A PR must not
        # mutate the shared QA/prod schema pre-merge; migrations belong on
        # push + supabase-migrations.yml. Skipping on pull_request also
        # removes the expired SUPABASE_ACCESS_TOKEN 401 from the merge gate
        # (ORA-2798/ORA-2391 credential rotation is founder-blocked).
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/apply_migrations.py
      - name: Run Playwright suite
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/.artifacts
            playwright-report
          retention-days: 7
