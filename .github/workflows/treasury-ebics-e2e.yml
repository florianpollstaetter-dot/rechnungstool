name: treasury-ebics-e2e

# ORA-2310 — Treasury Phase 3 W3.5 Playwright happy-path EBICS roundtrip.
#
# Brings the full local stack up in one runner:
#   - EBICS in-house mock (ORA-2297, port 5016)
#   - EBICS Java sidecar (ORA-2297, port 8081, talks to the mock)
#   - Next.js dev server (talks to the sidecar via EBICS_SIDECAR_BASE_URL
#     and to Supabase QA via the standard NEXT_PUBLIC_* secrets)
# Then runs only `tests/e2e/specs/15-treasury-ebics-happy-path.spec.ts` and
# uploads the Playwright HTML report + container logs as artifacts.
#
# Kept as a separate workflow from `treasury-poc-e2e.yml` so that:
#   - The sidecar smoke (ORA-2297 acceptance) stays a focused, fast PoC job.
#   - This job — which depends on the full Next.js stack + shared QA Supabase
#     — has its own retention + secret-scope policy.
# Folding the two together is a follow-up integration step for ORA-2288.
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROJECT_REF
#   TREASURY_E2E_CRON_SECRET — secret the test sets as $CRON_SECRET when
#                              booting `next dev`. Any non-empty random
#                              string is fine; same value is forwarded as
#                              the `Authorization: Bearer …` of the test's
#                              poll call.

on:
  push:
    branches: [master, "feature/treasury-**"]
    paths:
      - "src/app/api/treasury/ebics/**"
      - "src/app/(app)/treasury/**"
      - "src/lib/treasury/ebics/**"
      - "tests/e2e/specs/15-treasury-ebics-happy-path.spec.ts"
      - "tests/e2e/helpers/treasury-ebics.ts"
      - "treasury-poc/docker-compose.ebics-mock.yml"
      - "treasury-poc/services/ebics-sidecar-java/**"
      - "treasury-poc/services/ebics-mock-server/**"
      - ".github/workflows/treasury-ebics-e2e.yml"
  pull_request:
    paths:
      - "src/app/api/treasury/ebics/**"
      - "src/app/(app)/treasury/**"
      - "src/lib/treasury/ebics/**"
      - "tests/e2e/specs/15-treasury-ebics-happy-path.spec.ts"
      - "tests/e2e/helpers/treasury-ebics.ts"
      - "treasury-poc/docker-compose.ebics-mock.yml"
      - "treasury-poc/services/ebics-sidecar-java/**"
      - "treasury-poc/services/ebics-mock-server/**"
      - ".github/workflows/treasury-ebics-e2e.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CRON_SECRET: ${{ secrets.TREASURY_E2E_CRON_SECRET }}
      EBICS_SIDECAR_BASE_URL: http://127.0.0.1:8081
      EBICS_HOST_ID: OCTOPOC
      EBICS_PARTNER_ID: OCTO001
      EBICS_USER_ID: OCTOUSR1
      EBICS_BANK_URL: http://ebics-mock:5016/ebicsweb
      BASE_URL: http://127.0.0.1:3000
      CI: "true"
    steps:
      - name: Guard — required secrets must be present
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          [ -n "$CRON_SECRET" ] || missing+=("TREASURY_E2E_CRON_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}" >&2
            echo "Add them under Settings → Secrets → Actions." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sidecar + mock images
        working-directory: treasury-poc
        run: |
          docker buildx build --load \
            -t ebics-sidecar-java:ci \
            ./services/ebics-sidecar-java
          docker buildx build --load \
            -t ebics-mock-server:0.1.0 \
            ./services/ebics-mock-server

      - name: Bring up EBICS mock + sidecar
        working-directory: treasury-poc
        run: |
          docker compose -f docker-compose.ebics-mock.yml up -d ebics-mock
          docker compose -f docker-compose.ebics-mock.yml up -d ebics-sidecar

      - name: Wait for sidecar readiness
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8081/actuator/health/readiness; then
              echo "sidecar ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::sidecar never became ready"; exit 1

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Apply pending Supabase migrations
        # ORA-2901: only run on push-to-master (not on PRs). A PR must not
        # mutate the shared QA/prod schema pre-merge; migrations belong on
        # push + supabase-migrations.yml. Skipping on pull_request also
        # removes the expired SUPABASE_ACCESS_TOKEN 401 from the merge gate
        # (ORA-2798/ORA-2391 credential rotation is founder-blocked).
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/apply_migrations.py

      - name: Boot Next.js (background)
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          echo "next dev pid: $!"
          # Wait for /api up — /api/healthz is the cheapest endpoint and
          # serves JSON without authenticating.
          for i in $(seq 1 120); do
            if curl -sf "${BASE_URL}/api/healthz" >/dev/null 2>&1 \
              || curl -sf "${BASE_URL}/login" >/dev/null 2>&1; then
              echo "next dev ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::next dev never became ready"
          tail -200 /tmp/next-dev.log || true
          exit 1

      - name: Run happy-path spec
        run: |
          npx playwright test \
            --reporter=html,list \
            --output=tests/e2e/.artifacts \
            tests/e2e/specs/15-treasury-ebics-happy-path.spec.ts

      - name: Capture container + dev-server logs
        if: always()
        run: |
          mkdir -p e2e-logs
          docker logs ebics-sidecar > e2e-logs/sidecar.log 2>&1 || true
          docker logs ebics-mock > e2e-logs/ebics-mock.log 2>&1 || true
          docker compose -f treasury-poc/docker-compose.ebics-mock.yml logs --no-color \
            > e2e-logs/compose.log 2>&1 || true
          cp /tmp/next-dev.log e2e-logs/next-dev.log 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-ebics-e2e-report
          path: |
            playwright-report
            tests/e2e/.artifacts
          retention-days: 14

      - name: Upload container + dev-server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-ebics-e2e-logs
          path: e2e-logs/
          retention-days: 14

      - name: Compose down
        if: always()
        working-directory: treasury-poc
        run: docker compose -f docker-compose.ebics-mock.yml down -v
