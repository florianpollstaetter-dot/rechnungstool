name: RLS tenant isolation tests

# SCH-833 — Runs the cross-tenant RLS smoke test whenever migrations change.
# Uses the live Supabase project (shared with Playwright CI).

on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - "tests/rls/**"
      - ".github/workflows/rls-tests.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/rls/**"
      - ".github/workflows/rls-tests.yml"
  workflow_dispatch: {}

jobs:
  lint-migrations:
    name: Check for permissive USING(true) policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run migration lint
        run: bash scripts/check-migrations.sh

  rls-isolation:
    name: Cross-tenant isolation smoke test
    runs-on: ubuntu-latest
    needs: lint-migrations
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Guard — Supabase secrets must be present
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]    || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]   || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 .github/scripts/apply_migrations.py
      - name: Run RLS isolation test
        run: node tests/rls/check_tenant_isolation.mjs
